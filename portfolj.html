const sortS = {0:{col:'mv',dir:-1},1:{col:'mv',dir:-1},2:{col:'mv',dir:-1}};
function sortBy(idx, col) {
  if (sortS[idx].col === col) sortS[idx].dir = -sortS[idx].dir;
  else { sortS[idx].col = col; sortS[idx].dir = -1; }
  r1();
}
function sortData(arr, col, dir) {
  return [...arr].sort((a,b) => {
    let av = a[col], bv = b[col];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    if (typeof av === 'string') return dir * av.localeCompare(bv,'sv');
    return dir * (bv - av);
  });
}
function sortInd(idx, col) {
  if (sortS[idx].col !== col) return '';
  return `<span class="sort-ind">${sortS[idx].dir === -1 ? '↓' : '↑'}</span>`;
}

// ══════════ CSV-UPPLADDNING & PARSER ══════════
function cnum(s){
  if(s==null) return 0;
  s = String(s).replace(/\u00a0/g,'').replace(/ /g,'').replace(/%/g,'').replace(/\u2212/g,'-').replace(/,/g,'.');
  s = s.replace(/[^\d.\-]/g,'');
  if(s===''||s==='.'||s==='-'||s==='-.') return 0;
  const v = parseFloat(s); return isNaN(v)?0:v;
}
function splitCSV(line){
  const out=[]; let cur='', q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){ q=!q; }
    else if((c===','||c===';'||c==='\t') && !q){ out.push(cur); cur=''; }
    else cur+=c;
  }
  out.push(cur); return out;
}
function parseCSV(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim()!=='');
  return lines.map(splitCSV);
}
function ratN(rat){
  const r=String(rat).toLowerCase();
  return r.includes('strong buy')?2:(r==='buy'?1:(r.includes('sell')?-1:0));
}

function detectAndParse(name, rows){
  const hdr = rows[0].map(h=>h.trim());
  const H = {}; hdr.forEach((h,i)=>H[h]=i);
  const has = k => hdr.some(h=>h===k||h.trim()===k);
  const idx = k => { for(let i=0;i<hdr.length;i++){ if(hdr[i]===k||hdr[i].trim()===k) return i; } return -1; };
  
  // MANUELLT (Nyckel,Värde)
  if(has('Nyckel') && has('Värde')){
    const m={}; for(let i=1;i<rows.length;i++){ const k=rows[i][0]?.trim(); const v=rows[i][1]; if(k) m[k]=v; }
    // Cash och TotaltKonto läses INTE längre härifrån — de kommer från Likviditet-fliken.
    if(m.UttagYTD!=null) D.uttag=cnum(m.UttagYTD);
    if(m['UttagYTD']==null && m['Uttag YTD']!=null) D.uttag=cnum(m['Uttag YTD']);
    if(m.IB!=null) D.ib=cnum(m.IB);
    if(m.Dreams!=null) D.dreams=cnum(m.Dreams);
    if(m['Daniel lån']!=null) D.daniel=cnum(m['Daniel lån']);
    if(m['DanielLan']!=null) D.daniel=cnum(m['DanielLan']);
    if(m.Datum!=null) D.upd=String(m.Datum).trim();
    return 'Manuellt';
  }
  // LIKVIDITET (har Likviditet + Typ). Summerar Taktisk vs Reserv.
  // Taktisk (LYSA, AZA-cash, SEB) -> D.cash (in i allokering).
  // Reserv (SBAB-lägenhetslikvid) -> D.reserv (bara i totalen).
  if(idx('Likviditet')>=0 && idx('Typ')>=0){
    const cN=idx('Likviditet'), cMV=idx('Marknadsvärde'), cT=idx('Typ');
    let taktisk=0, reserv=0; const rowsL=[];
    for(let i=1;i<rows.length;i++){
      const nm=rows[i][cN]?.trim(); if(!nm) continue;
      const mv=cnum(rows[i][cMV]); const typ=(rows[i][cT]||'').trim().toLowerCase();
      if(typ==='reserv'){ reserv+=mv; } else { taktisk+=mv; }  // default = taktisk
      rowsL.push({n:nm,mv:Math.round(mv),typ:typ==='reserv'?'Reserv':'Taktisk'});
    }
    D.cash   = Math.round(taktisk);
    D.reserv = Math.round(reserv);
    D.likvid = rowsL;
    return 'Likviditet ('+rowsL.length+')';
  }
  // AKTIER (har Värdepapper + RSI14)
  if(idx('Värdepapper')>=0 && idx('RSI14')>=0){
    const c={vp:idx('Värdepapper'),br:idx('Bransch'),la:idx('Land'),mv:idx('Marknadsvärde'),
      ik:idx('Inköpsvärde'),sk:idx('Sedan köp kr'),ytd:idx('Perf_YTD'),p1v:idx('Perf_1v'),
      p1m:idx('Perf_1m'),rsi:idx('RSI14'),rat:idx('Analyst rating'),
      close:idx('Close'),yh:idx('YestHigh'),s20:idx('SMA20')};
    const arr=[];
    for(let i=1;i<rows.length;i++){
      const r=rows[i]; const mv=cnum(r[c.mv]); if(mv<=0) continue;
      const ik=cnum(r[c.ik]), sk=cnum(r[c.sk]);
      arr.push({n:r[c.vp]?.trim(),mv:Math.round(mv),ik:Math.round(ik),skK:Math.round(sk),
        skP:ik?+(sk/ik*100).toFixed(2):0,br:r[c.br]?.trim(),la:r[c.la]?.trim(),
        ytd:+cnum(r[c.ytd]).toFixed(2),p1v:+cnum(r[c.p1v]).toFixed(2),p1m:+cnum(r[c.p1m]).toFixed(2),
        rsi:+cnum(r[c.rsi]).toFixed(2),rat:r[c.rat]?.trim()||'No rating',rN:ratN(r[c.rat]),
        close:cnum(r[c.close]),yh:cnum(r[c.yh]),s20:cnum(r[c.s20])});
    }
    if(arr.length){ D.aktier=arr; return 'Aktier ('+arr.length+')'; }
  }
  // FOND (har Fond + FondTyp)
  if(idx('Fond')>=0 && idx('FondTyp')>=0){
    const mvCol = hdr.findIndex(h=>/\u00a0/.test(h)||/^\d[\d\s\u00a0]+$/.test(h.trim()));
    const c={fond:idx('Fond'),typ:idx('FondTyp'),bank:idx('Bank'),ik:idx('Inköpsvärde'),
      skp:idx('Sedan köp %'),p1v:idx('Perf_1v'),p1m:idx('Perf_1m'),ytd:idx('Perf_YTD')};
    const ACT=D._actMap||{};
    const arr=[];
    for(let i=1;i<rows.length;i++){
      const r=rows[i]; const mv=cnum(r[mvCol]); if(mv<=0) continue;
      const ik=cnum(r[c.ik]); const nm=r[c.fond]?.trim();
      arr.push({n:nm,typ:r[c.typ]?.trim(),bank:r[c.bank]?.trim(),mv:Math.round(mv),ik:Math.round(ik),
        skP:+cnum(r[c.skp]).toFixed(2),skK:Math.round(mv-ik),
        p1v:+(cnum(r[c.p1v])*100).toFixed(2),p1m:+(cnum(r[c.p1m])*100).toFixed(2),
        ytd:+(cnum(r[c.ytd])*100).toFixed(2),act:ACT[nm]||'Behåll'});
    }
    if(arr.length){ D.fonder=arr; return 'Fonder ('+arr.length+')'; }
  }
  // CERT (har Certifikat)
  if(idx('Certifikat')>=0 && idx('Sedan köp %')>=0){
    const mvCol = hdr.findIndex(h=>/\u00a0/.test(h)||/^\d[\d\s\u00a0]+$/.test(h.trim()));
    const c={n:idx('Certifikat'),ik:idx('Inköpsvärde'),sk:idx('Sedan köp kr'),
      skp:idx('Sedan köp %'),p1m:idx('Perf_1m'),ytd:idx('Perf_YTD')};
    const arr=[];
    for(let i=1;i<rows.length;i++){
      const r=rows[i]; const mv=cnum(r[mvCol]); if(mv<=0) continue;
      arr.push({n:r[c.n]?.trim(),mv:Math.round(mv),ik:Math.round(cnum(r[c.ik])),
        skK:Math.round(cnum(r[c.sk])),skP:+cnum(r[c.skp]).toFixed(2),
        p1m:+(cnum(r[c.p1m])*100).toFixed(2),ytd:+(cnum(r[c.ytd])*100).toFixed(2)});
    }
    if(arr.length){ D.cert=arr; return 'Certifikat ('+arr.length+')'; }
  }
  // INDEX (kolumn 1 = datum-header "Uppdaterad:")
  if(hdr.length>=8 && /Uppdaterad/i.test(hdr[1]||'')){
    D.idxUpd = hdr[1].replace(/Uppdaterad:\s*/i,'').trim();
    const want={'Nasdaq 100':'Nasdaq 100','Dow Jones U.S. Index':'Dow Jones US','OMX Stockholm 30':'OMX Stockholm 30',
      'Dow Jones Industrial Average':'Dow Jones Ind.','OMX Stockholm PI':'OMX Stockholm PI','DAX':'DAX'};
    const newIdx=[];
    for(let i=1;i<rows.length;i++){
      const nm=rows[i][0]?.trim();
      if(want[nm]!=null){ newIdx.push({n:want[nm],ytd:+(cnum(rows[i][5])*100).toFixed(1),p1m:+(cnum(rows[i][3])*100).toFixed(1),isP:false}); }
    }
    if(newIdx.length){
      newIdx.push({n:'Din portfölj',ytd:D.ytdP,p1m:null,isP:true});
      newIdx.sort((a,b)=>b.ytd-a.ytd);
      D.idx=newIdx;
    }
    return 'Index';
  }
  return null;
}

// Recompute totals from parsed data
function recompute(){
  const aktMV = D.aktier.reduce((s,a)=>s+a.mv,0);
  const fondMV = D.fonder.reduce((s,f)=>s+f.mv,0);
  const certMV = D.cert.reduce((s,c)=>s+c.mv,0);
  // Aktiv portfölj = värdepapper + taktisk cash (SBAB-reserv ingår EJ här)
  D.portf = aktMV + fondMV + certMV + (D.cash||0);
  // Total förmögenhet = aktiv portfölj + reserv (SBAB-lägenhetslikvid)
  D.total = D.portf + (D.reserv||0);
  // Allokering — mot aktiv portfölj. Reserv visas ej (skulle bli ~78% cash).
  D.allok = [
    {n:'Fonder',v:fondMV,p:+(fondMV/D.portf*100).toFixed(2),c:'#4A9EFF'},
    {n:'Aktier',v:aktMV,p:+(aktMV/D.portf*100).toFixed(2),c:'#2ECC8A'},
    {n:'Cash',v:(D.cash||0),p:+((D.cash||0)/D.portf*100).toFixed(2),c:'#FF4D6B'},
    {n:'Certifikat',v:certMV,p:+(certMV/D.portf*100).toFixed(2),c:'#F5B942'},
  ];
  // YTD mot aktiv portfölj (D.portf), ej total. Lägenhetslikviden (SBAB)
  // ingick inte i IB 5 jan och ska därför inte räknas som avkastning.
  // VF1 (Brutto): procent = (UB - IB + uttag)/IB
  // VF2 (Netto):  procent = (UB - IB)/IB
  if(D.ib && D.portf){
    const ub = D.portf;
    D.ytdKr = Math.round(ub - D.ib);
    D.ytdP = +((ub - D.ib + (D.uttag||0))/D.ib*100).toFixed(2);
    D.nettoKr = Math.round(ub - D.ib - (D.uttag||0));
    D.nettoP = +((ub - D.ib)/D.ib*100).toFixed(2);
  }
  // uppdatera portföljraden i index
  const pIdx = D.idx.find(x=>x.isP); if(pIdx) pIdx.ytd=D.ytdP;
  // header
  document.getElementById('hdr-date').textContent='Uppdaterad '+D.upd;
  document.getElementById('hdr-total').textContent=F(D.total||D.portf)+' kr';
  document.getElementById('hdr-ytd').textContent=P(D.ytdP)+' YTD · +'+F(D.ytdKr)+' kr';
}

// Plocka nyaste fil per typ ur filnamnsdatum (YYYY-MM-DD_Typ.csv).
// Skyddar mot att en äldre fil skriver över nyare om flera dagars filer markeras.
// Filer utan känt typ-mönster i namnet släpps igenom oförändrade (parsern avgör).
function pickLatestByName(files){
  const TYPE=[[/aktier/i,'aktier'],[/fond/i,'fond'],[/cert/i,'cert'],[/index/i,'index'],[/manuellt/i,'manuellt']];
  const byType={}, passthrough=[];
  for(const f of files){
    const dm=f.name.match(/(\d{4}-\d{2}-\d{2})/); const date=dm?dm[1]:null;
    let type=null; for(const [re,t] of TYPE){ if(re.test(f.name)){type=t;break;} }
    if(type===null||date===null){ passthrough.push(f); continue; }
    if(!byType[type] || date>byType[type].date) byType[type]={file:f,date};
  }
  return [...Object.values(byType).map(x=>x.file), ...passthrough];
}

};

// Hämta alla flikar via fetch (körs i webbläsaren). Ordning: manuellt+index sist
// spelar ingen roll här — recompute() körs efter att allt parsats.
async function fetchAllSheets(){
  const status=document.getElementById('upstatus');
  if(status) status.textContent='Hämtar färsk data från Google Sheets…';
  // Manuellt först så D.ib/konto finns när Index beräknar portföljraden
  const order=['manuellt','likviditet','aktier','fond','cert','index'];
  const done=[], failed=[];
  const fetched=await Promise.allSettled(order.map(async t=>{
    const res=await fetch(SHEET_URLS[t],{cache:'no-store'});
    if(!res.ok) throw new Error(t+' HTTP '+res.status);
    return {t, text:await res.text()};
  }));
  // bearbeta i definierad ordning (inte i den ordning de råkar komma)
  const byType={};
  fetched.forEach((r,i)=>{ if(r.status==='fulfilled') byType[order[i]]=r.value.text; else failed.push(order[i]); });
  for(const t of order){
    if(!byType[t]) continue;
    try{ const res=detectAndParse(t, parseCSV(byType[t])); if(res) done.push(res); }
    catch(err){ console.error(t,err); failed.push(t); }
  }
  if(done.length){
    recompute();
    rendered.fill(false);
    renders[cur](); rendered[cur]=true;
    if(status){
      status.textContent='✓ Hämtat: '+done.join(', ')+' · '+new Date().toLocaleTimeString('sv-SE');
      if(failed.length) status.textContent+=' (ej hämtat: '+failed.join(', ')+')';
    }
  } else if(status){
    status.textContent='⚠ Kunde inte hämta data. Kontrollera länkarna eller ladda upp filer manuellt.';
  }
}

document.getElementById('csvup').addEventListener('change', async (e)=>{
  const files=pickLatestByName([...e.target.files]); if(!files.length) return;
  const status=document.getElementById('upstatus');
  status.textContent='Läser '+files.length+' filer...';
  const done=[];
  for(const f of files){
    try{
      const txt=await f.text();
      const rows=parseCSV(txt);
      const res=detectAndParse(f.name, rows);
      if(res) done.push(res);
    }catch(err){ console.error(f.name,err); }
  }
  recompute();
  rendered.fill(false);
  renders[cur](); rendered[cur]=true;
  status.textContent='✓ Inläst: '+(done.join(', ')||'inga kända filer')+' · '+new Date().toLocaleTimeString('sv-SE');
});

// Hämta automatiskt vid sidladdning (fetch primärt, uppladdning som reserv)
fetchAllSheets();
